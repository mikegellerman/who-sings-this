<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Sang This? — Playback Test</title><style>*{box-sizing:border-box}body{background:#050505;color:#fff;font-family:system-ui,Arial;text-align:center;margin:0}.wrap{max-width:460px;margin:auto;padding:22px 16px}.logo{font-family:Georgia,serif;font-size:clamp(48px,13vw,76px);font-weight:bold;line-height:1.05;margin:45px auto 40px;color:#050505;-webkit-text-stroke:1.5px #fa3434;text-shadow:2px 2px #55ed50;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.025)}}.time{font-size:28px;margin:20px}button,input{font-size:18px;padding:14px;border:0;border-radius:12px}button{background:#288e4c;color:white;font-weight:bold}button.alt{background:#343434}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}input{width:100%;margin:18px 0;color:#111}.msg{min-height:24px;margin:20px}.small{color:#bbb;font-size:13px;margin:18px}</style></head><body><div class="wrap"><div class="logo">Who<br>sang<br>this?</div><div class="time" id="clock">0:00</div><div class="controls"><button id="play">▶ Play test audio</button><button class="alt" id="hint">Hint</button><button class="alt" id="give">Give up</button></div><input id="answer" placeholder="Type the artist's name" autocomplete="off"><div class="controls"><button id="submit">Submit answer</button><button class="alt" id="reset">Play again</button></div><div class="msg" id="msg"></div><div class="small">Playback test only — original Spacehog recording is not included. This test uses a generated melody to confirm that audio works in Safari.</div></div><script>let ctx,timer,started=0,elapsed=0,playing=false,ended=false,hints=0,nodes=[];const $=x=>document.getElementById(x);const notes=[392,440,523.25,440,392,329.63,349.23,392,523.25,493.88,440,392,349.23,329.63,392,440,523.25,587.33,523.25,440,392,349.23,329.63,392];function stop(){if(ctx){ctx.close();ctx=null}nodes=[];clearInterval(timer);playing=false;$('play').textContent='▶ Play test audio'}function tick(){elapsed=Math.min(24,(performance.now()-started)/1000);$('clock').textContent='0:'+String(Math.floor(elapsed)).padStart(2,'0');if(elapsed>=24){stop();ended=true;$('msg').textContent='Time! Test answer: Spacehog.'}}$('play').onclick=async()=>{if(ended)return;if(playing){stop();return}try{ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const t=ctx.currentTime;notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i);g.gain.exponentialRampToValueAtTime(.11,t+i+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i+.9);o.connect(g).connect(ctx.destination);o.start(t+i);o.stop(t+i+.92);nodes.push(o)});started=performance.now();playing=true;timer=setInterval(tick,100);$('play').textContent='■ Stop audio';$('msg').textContent='Audio is playing!'}catch(e){$('msg').textContent='Audio failed: '+e.message}};$('submit').onclick=()=>{if(ended)return;const a=$('answer').value.toLowerCase().replace(/[^a-z]/g,'');if(a==='spacehog'){stop();ended=true;$('msg').textContent='Correct! Spacehog — '+Math.max(10,1000-Math.floor(elapsed)*12-hints*150)+' points.'}else $('msg').textContent='Try again!'};$('answer').onkeydown=e=>{if(e.key==='Enter')$('submit').click()};$('hint').onclick=()=>{if(ended)return;hints++;$('msg').textContent=['British-American rock band','Known for a 1995 hit','Artist starts with S','S P A C E _ _ _'][Math.min(hints-1,3)]};$('give').onclick=()=>{stop();ended=true;$('msg').textContent='The answer was Spacehog.'};$('reset').onclick=()=>{stop();ended=false;hints=0;elapsed=0;$('clock').textContent='0:00';$('msg').textContent='';$('answer').value=''};</script></body></html>
